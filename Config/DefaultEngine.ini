[/Script/EngineSettings.GameMapsSettings]
; The game opens on the main menu (a live shot of the boat at night). The editor still opens on the ocean test map,
; so pressing Play drops you straight onto the deck (and the automated tests play it).
GameDefaultMap=/Game/Riptide/Maps/MainMenu.MainMenu
EditorStartupMap=/Game/Riptide/Maps/Ocean_Test.Ocean_Test
GlobalDefaultGameMode=/Script/Riptide.RiptideGameMode
GameInstanceClass=/Script/Riptide.RiptideGameInstance

; Each player's callsign and look go with them when they join a game (see URiptideLocalPlayer).
[/Script/Engine.Engine]
LocalPlayerClassName=/Script/Riptide.RiptideLocalPlayer

; --- Online play ---
; Steam when it's running (hosting, the game browser, friends' games and invites through the Steam overlay), using
; Valve's public test app 480 ("Spacewar") until Riptide has its own Steam app id. Without Steam (it isn't running,
; the -nosteam switch, or playing in the editor) the engine falls back to the Null subsystem: games on the local
; network show in the browser, and anyone can join by IP address.
[OnlineSubsystem]
DefaultPlatformService=Steam
; Games are matched by the engine's network version, so any two copies built from the same engine version (Windows
; or Mac) find and join each other.
bUseBuildIdOverride=false
BuildIdOverride=0

[OnlineSubsystemSteam]
bEnabled=true
SteamDevAppId=480
; Don't quit and relaunch through Steam when started directly (from the editor, a shortcut or a test).
bRelaunchInSteam=false
; A listen server (the host) also runs as a Steam game server, so its game can be found and joined.
bInitServerOnClient=true
GameServerQueryPort=27015
; Game traffic goes over Steam's own networking (SteamSockets, below), through NAT without port forwarding.
bUseSteamNetworking=true

; Players connect through Steam Sockets when Steam is up. Its driver reports itself unavailable without Steam, and
; the engine then uses the plain IP driver, so LAN and join-by-IP games keep working.
[/Script/Engine.GameEngine]
!NetDriverDefinitions=ClearArray
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/SteamSockets.SteamSocketsNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")
+NetDriverDefinitions=(DefName="DemoNetDriver",DriverClassName="/Script/Engine.DemoNetDriver",DriverClassNameFallback="/Script/Engine.DemoNetDriver")

[/Script/SteamSockets.SteamSocketsNetDriver]
NetConnectionClassName="/Script/SteamSockets.SteamSocketsNetConnection"

; Up to four crew in a game.
[/Script/Engine.GameSession]
MaxPlayers=4

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

[/Script/Engine.CollisionProfile]
+Profiles=(Name="WaterBodyCollision",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="WorldStatic",CustomResponses=((Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Vehicle",Response=ECR_Overlap),(Channel="Destructible",Response=ECR_Overlap)),HelpMessage="Default Water Collision Profile (Created by Water Plugin)")

[/Script/Engine.PhysicsSettings]
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6

; Virtual shadow maps need Shader Model 6 on Windows (DirectX 12).
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

